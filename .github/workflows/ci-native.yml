
name: Flask CI Pipeline

"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<24"
          pip install "Werkzeug<1.0" "MarkupSafe<2.1"
          pip install -r requirements.txt

      - name: Initialize SQLite database
        run: |
          python manage.py db upgrade

      - name: Smoke test Flask server
        run: |
          python manage.py runserver &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for i in {1..15}; do
            if curl -f http://127.0.0.1:7345/; then
              echo "Flask server is working!"
              exit 0
            fi
            sleep 2
          done

          echo "Flask server failed"
          exit 1
